services:
  - type: web
    name: ecommerce-backend-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    region: oregon
    healthCheckPath: /health
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ConnectionStrings__DefaultConnection
        sync: false
      - key: Jwt__Secret
        sync: false
      - key: Jwt__Issuer
        value: EcommerceAPI
      - key: Jwt__Audience
        value: EcommerceClient
      - key: Jwt__ExpiryInDays
        value: "7"
