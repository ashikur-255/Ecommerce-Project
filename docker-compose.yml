services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: ecommerce_sqlserver
    restart: always
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:-YourStrong@Password123!}"
      MSSQL_PID: "Express"
    ports:
      - "1433:1433"
    volumes:
      - mssql_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD:-YourStrong@Password123!}\" -C -Q \"SELECT 1\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - ecommerce_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ecommerce_backend
    restart: always
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:5000
      - ConnectionStrings__DefaultConnection=Server=sqlserver,1433;Database=EcommerceDB;User Id=sa;Password=${MSSQL_SA_PASSWORD:-YourStrong@Password123!};TrustServerCertificate=True;MultipleActiveResultSets=True;
      - Jwt__Secret=${JWT_SECRET:-super_secret_jwt_key_at_least_32_characters_long_12345}
      - Jwt__Issuer=${JWT_ISSUER:-EcommerceAPI}
      - Jwt__Audience=${JWT_AUDIENCE:-EcommerceClient}
      - Cors__AllowedOrigins__0=http://localhost:5173
      - Cors__AllowedOrigins__1=http://localhost:3000
      - Cors__AllowedOrigins__2=http://localhost
      - Email__FromName=${EMAIL_FROM_NAME:-Adidas Store}
      - Email__FromEmail=${EMAIL_FROM_EMAIL:-ashikurr255@gmail.com}
      - Email__Host=${EMAIL_HOST:-smtp.gmail.com}
      - Email__Port=${EMAIL_PORT:-587}
      - Email__Username=${EMAIL_USERNAME:-ashikurr255@gmail.com}
      - Email__Password=${EMAIL_PASSWORD:-fyqqdpcckwpditpn}
      - Email__EnableSsl=true
      - SmsNetBd__ApiKey=${SMS_API_KEY:-5C1r74t3eB3vjLAh0T4qGR2NJd8POu8WQM6trfqd}
      - Stripe__SecretKey=${STRIPE_SECRET_KEY}
      - Stripe__PublishableKey=${STRIPE_PUBLISHABLE_KEY}
      - Bkash__AppKey=${BKASH_APP_KEY}
      - Bkash__AppSecret=${BKASH_APP_SECRET}
      - Bkash__Username=${BKASH_USERNAME}
      - Bkash__Password=${BKASH_PASSWORD}
      - SSLCommerz__StoreId=${SSLCOMMERZ_STORE_ID}
      - SSLCommerz__StorePasswd=${SSLCOMMERZ_STORE_PASSWD}
      - Steadfast__ApiKey=${STEADFAST_API_KEY}
      - Steadfast__SecretKey=${STEADFAST_SECRET_KEY}
    ports:
      - "5000:5000"
    volumes:
      - backend_uploads:/app/wwwroot/uploads
    networks:
      - ecommerce_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_BASE_URL=http://localhost:5000/api
        - VITE_API_URL=http://localhost:5000/api
        - VITE_STRIPE_PUBLISHABLE_KEY=${STRIPE_PUBLISHABLE_KEY}
    container_name: ecommerce_frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - ecommerce_network

volumes:
  mssql_data:
  backend_uploads:

networks:
  ecommerce_network:
    driver: bridge

