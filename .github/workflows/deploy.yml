name: CI/CD Deployment Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  validate:
    name: Build & Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Restore & Build Backend
        run: |
          dotnet restore ./backend/EcommerceAPI.csproj
          dotnet build ./backend/EcommerceAPI.csproj -c Release --no-restore

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'

      - name: Install & Build Frontend
        working-directory: ./frontend
        run: |
          npm ci
          npm run build

      - name: Production Deployment Summary
        run: |
          echo "========================================================"
          echo "✅ Full-stack build & typecheck validated successfully!"
          echo "🌐 Frontend (Vercel): https://www.clickebd.xyz"
          echo "⚙️ Backend (Render):  https://ecommerce-backend-api-j6z4.onrender.com"
          echo "========================================================"
