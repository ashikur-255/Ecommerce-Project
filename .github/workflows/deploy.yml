name: CI/CD Deployment Pipeline

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  validate:
    name: Build & Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Restore & Build Backend
        run: |
          dotnet restore ./backend/EcommerceAPI.csproj
          dotnet build ./backend/EcommerceAPI.csproj -c Release --no-restore

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'

      - name: Install & Build Frontend
        working-directory: ./frontend
        run: |
          npm ci
          npm run build

  deploy:
    name: Deploy to Production VPS
    needs: validate
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    env:
      SERVER_HOST: ${{ secrets.SERVER_HOST }}
      SERVER_USER: ${{ secrets.SERVER_USER }}
      SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
    steps:
      - name: Check VPS Secrets Configuration
        id: check_vps
        run: |
          if [ -z "$SERVER_HOST" ] || [ -z "$SERVER_USER" ] || [ -z "$SERVER_SSH_KEY" ]; then
            echo "⚠️ VPS deployment secrets (SERVER_HOST, SERVER_USER, SERVER_SSH_KEY) are not set in GitHub Secrets."
            echo "ℹ️ Since your app is hosted on Vercel (Frontend) and Render (Backend), VPS SSH deployment is safely skipped."
            echo "has_vps=false" >> $GITHUB_OUTPUT
          else
            echo "✅ VPS secrets detected. Proceeding with SSH deployment..."
            echo "has_vps=true" >> $GITHUB_OUTPUT
          fi

      - name: Deploy via SSH
        if: steps.check_vps.outputs.has_vps == 'true'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_SSH_PORT || 22 }}
          script: |
            set -e
            echo "🚀 Starting Deployment on Production Server..."
            
            # Navigate to project directory
            cd ${{ secrets.SERVER_APP_DIR || '~/Ecommerce-Project' }}
            
            # Pull latest changes
            echo "📥 Pulling latest git code..."
            git pull origin main
            
            # Rebuild and restart containers
            echo "🐳 Building and starting Docker containers..."
            docker compose -f docker-compose.prod.yml up -d --build
            
            # Clean up dangling images to save disk space
            echo "🧹 Cleaning unused docker images..."
            docker image prune -f
            
            echo "✅ Deployment completed successfully!"
