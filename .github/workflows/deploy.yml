name: CI/CD Deployment Pipeline

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  validate:
    name: Build & Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore & Build Backend
        run: |
          dotnet restore ./backend/EcommerceAPI.csproj
          dotnet build ./backend/EcommerceAPI.csproj -c Release --no-restore

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'

      - name: Install & Build Frontend
        working-directory: ./frontend
        run: |
          npm ci
          npm run build

  deploy:
    name: Deploy to Production VPS
    needs: validate
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_SSH_PORT || 22 }}
          script: |
            set -e
            echo "🚀 Starting Deployment on Production Server..."
            
            # Navigate to project directory
            cd ${{ secrets.SERVER_APP_DIR || '~/Ecommerce-Project' }}
            
            # Pull latest changes
            echo "📥 Pulling latest git code..."
            git pull origin main
            
            # Rebuild and restart containers
            echo "🐳 Building and starting Docker containers..."
            docker compose -f docker-compose.prod.yml up -d --build
            
            # Clean up dangling images to save disk space
            echo "🧹 Cleaning unused docker images..."
            docker image prune -f
            
            echo "✅ Deployment completed successfully!"

